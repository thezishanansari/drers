<div class="stat-grid">
  <div class="stat"><span class="stat-num">{{ stats.total }}</span><span class="stat-label">Total Reports</span></div>
  <div class="stat"><span class="stat-num amber">{{ stats.active }}</span><span class="stat-label">Active Incidents</span></div>
  <div class="stat"><span class="stat-num red">{{ stats.critical }}</span><span class="stat-label">Critical</span></div>
  <div class="stat"><span class="stat-num green">{{ stats.resolved }}</span><span class="stat-label">Resolved</span></div>
</div>
