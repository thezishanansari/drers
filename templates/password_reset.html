{% extends "base.html" %}
{% block title %}Reset Password · DRERS{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-panel">

    {% include "_auth_left.html" %}

    <div class="auth-right">

      <div class="tabs">
        #Reset Password</a>
      </div>

      <p class="note">
        Enter the email address associated with your DRERS account.
        We will send you a password reset link.
      </p>

      <form method="post" novalidate>
        {% csrf_token %}

        <div class="field">
          <label for="id_email">Email Address</label>
          <input
            type="email"
            name="email"
            id="id_email"
            placeholder="Enter your email address"
            required>
        </div>

        <button class="btn-red" type="submit">
          Send Reset Link
        </button>

        <div class="forgot-password" style="text-align:center;margin-top:20px;">
          <a href="{% url 'login' %}">
            ← Back to Login
          </a>
        </div>

      </form>

    </div>

  </div>
</div>
{% endblock %}
